
# Local development only - runs the API against the Dockerfile in this repo,
# with the source bind-mounted for hot reload. For a real deployment see
# deploy/docker-compose.prod.yml, which adds Caddy in front for TLS, a
# basic-auth gate, and the built frontend, and does not bind-mount source.
services:
  ocr-api:
    build: .
    image: pharmagpt-ocr-api:latest
    container_name: ocr_api_container
    ports:
      - "8000:8000"
    volumes:
      - ./datasets:/app/datasets
      - .:/app # hot-reload: requires `command` below to pass --reload
    env_file:
      - .env
    environment:
      - LOG_LEVEL=INFO
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    # No GPU reservation: the image installs requirements.txt, which the
    # default (and only production) extraction engine - Azure Document
    # Intelligence - does not need. A GPU device request here would simply
    # fail to start on any machine without nvidia-container-toolkit
    # configured, which is most laptops and every plain VPS.
